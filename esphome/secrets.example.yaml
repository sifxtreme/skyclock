# Copy to secrets.yaml in the same folder as skyclock-panel.yaml and fill in
# real values. Never commit secrets.yaml. These are placeholders.

wifi_ssid: "YOUR-2.4GHZ-WIFI-NAME"       # ESP32-S3 is 2.4 GHz only
wifi_password: "YOUR-WIFI-PASSWORD"

# Any URL that returns an 800x480 PNG, e.g. skyclock.py serve on your LAN:
#   http://192.168.X.Y:8790/sky.png   or a public https URL.
image_url: "http://192.168.X.Y:8790/sky.png"

# 32-byte base64 key. Generate once: openssl rand -base64 32
# Encrypts wireless logs and OTA uploads.
api_key: "PASTE-OUTPUT-OF-openssl-rand-base64-32"
